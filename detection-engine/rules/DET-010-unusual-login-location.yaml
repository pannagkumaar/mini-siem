id: DET-010
name: Successful Login Observed
description: >
  Baseline visibility rule that records every successful login as a
  low-severity alert. On its own this is informational (most logins are
  legitimate), but it gives the correlation engine the signal it needs to
  chain a successful login together with preceding/following suspicious
  activity (e.g. brute force -> successful login -> privilege escalation).
condition:
  event_type: login_success
severity: low
mitre_tag:
  - T1133
  - T1078
