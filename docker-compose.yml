services:
  opensearch:
    image: opensearchproject/opensearch:2.11.1 # Using a specific version is better practice
    container_name: opensearch-node
    environment:
      - cluster.name=opensearch-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true # along with the ulimits setting below
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" # demo purposes
      - "plugins.security.disabled=true" # Disable security plugin
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # Increase max file descriptors
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600" # for performance analyzer
    networks:
      - siem-net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node:9200"]'
    depends_on:
      - opensearch
    networks:
      - siem-net


  ingestion-api:
    build:
      context: .
      dockerfile: ingestion/api-python/Dockerfile
    container_name: ingestion-api
    ports:
      - "8000:8000"
    environment:
      # AI SOC Agent LLM provider - set any one of these (see .env.example).
      # None required: the agent falls back to template-based RCA.
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - SIEM_API_KEY=${SIEM_API_KEY}
      # Standalone detection-engine/correlation-engine containers below
      # already run the detection/correlation loops - disable the in-API
      # copies here so alerts/incidents aren't processed twice.
      - RUN_ENGINES_IN_API=false
    networks:
      - siem-net
    depends_on:
      - opensearch

  syslog-server:
    build:
      context: .
      dockerfile: ingestion/syslog-server-go/Dockerfile
    container_name: syslog-server
    ports:
      - "514:514/udp"
    networks:
      - siem-net
    depends_on:
      - ingestion-api

  react-ui:
    build:
      context: .
      dockerfile: frontend/react-ui/Dockerfile
    container_name: react-ui
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_KEY=${SIEM_API_KEY}
    networks:
      - siem-net
    depends_on:
      - ingestion-api

  detection-engine:
    build:
      context: .
      dockerfile: detection-engine/Dockerfile
    container_name: detection-engine
    networks:
      - siem-net
    depends_on:
      - opensearch
      - ingestion-api
    restart: unless-stopped

  correlation-engine:
    build:
      context: .
      dockerfile: correlation-engine/Dockerfile
    container_name: correlation-engine
    networks:
      - siem-net
    depends_on:
      - opensearch
      - detection-engine
    restart: unless-stopped

  # Note: there is no standalone "ai-agent" container. The AI Security Agent
  # (ingestion/api-python/ai_agent) runs inside the ingestion-api service and
  # is reachable through its /ai/* endpoints. It auto-detects whichever LLM
  # provider key is set (Groq/OpenAI/Anthropic/Gemini - ingestion-api
  # environment above) and falls back to a deterministic template-based RCA
  # when none are configured.

volumes:
  opensearch-data:
    driver: local

networks:
  siem-net:
    driver: bridge
