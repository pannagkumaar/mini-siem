id: RULE-EP-003
name: Credential Dumping Tool Detected
description: >
  Detects execution of well-known credential dumping tools/techniques
  (Mimikatz, procdump against lsass.exe, secretsdump.py, gsecdump) used to
  extract passwords, hashes, or Kerberos tickets from memory or the SAM/NTDS
  database.
severity: critical
log_source: windows
type: single
condition:
  event_type: credential_dumping
  raw.tool:
    in:
      - mimikatz
      - procdump
      - gsecdump
      - pwdump
      - secretsdump.py
mitre_technique:
  - id: T1003
    name: OS Credential Dumping
  - id: T1003.001
    name: LSASS Memory
false_positives:
  - Authorized red-team / purple-team exercise
  - Legitimate use of procdump for application crash-dump troubleshooting
remediation:
  - Isolate the host immediately; assume domain credentials are compromised
  - Force a password reset / Kerberos ticket invalidation (krbtgt rotation)
  - Enable Credential Guard and LSA Protection (RunAsPPL)
  - Hunt for lateral movement using the potentially stolen credentials
sample_log:
  timestamp: "2026-07-12T12:10:00Z"
  source: windows
  host: dc-01
  user: SYSTEM
  ip: 10.0.1.5
  event_type: credential_dumping
  severity: critical
  raw:
    tool: mimikatz
    target: "lsass.exe"
    commandline: "mimikatz.exe \"privilege::debug\" \"sekurlsa::logonpasswords\""
